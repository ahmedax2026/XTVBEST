name: XBest CPU GPU and login checks

on:
  push:
    branches: [feature/xbest-studio]
  pull_request:
    branches: [feature/xbest-studio, feature/xbest-cpu-gpu-auth, feature/xbest-live-monitor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable workspace package manager
        run: |
          npm install -g corepack@latest
          corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format changed XBEST source for verification
        run: pnpm exec prettier --write docs/XBEST-OWNER-AR.md server/src/cli/RunServerCommand.ts server/src/services/desktop/DesktopStartup.ts server/src/services/desktop/DesktopStartup.test.ts server/scripts/releaseArchive.ts server/scripts/releaseArchive.test.ts server/scripts/make-bin.ts web/src/pages/settings/AccessSettingsPage.tsx plans/xbest-delivery-checklist.md server/src/db/nativeSqliteOptions.ts server/src/db/nativeSqliteOptions.test.ts server/src/db/DBAccess.ts
      - name: Record formatted source for the author
        if: runner.os == 'Linux'
        run: |
          node --input-type=module -e 'import fs from "node:fs"; for (const p of ["docs/XBEST-OWNER-AR.md","server/src/cli/RunServerCommand.ts","server/src/services/desktop/DesktopStartup.ts","server/src/services/desktop/DesktopStartup.test.ts","server/scripts/releaseArchive.ts","server/scripts/releaseArchive.test.ts","server/scripts/make-bin.ts","web/src/pages/settings/AccessSettingsPage.tsx","plans/xbest-delivery-checklist.md","server/src/db/nativeSqliteOptions.ts","server/src/db/nativeSqliteOptions.test.ts","server/src/db/DBAccess.ts"]) console.log("XBEST_FORMATTED "+JSON.stringify({path:p,content:fs.readFileSync(p,"utf8")}));'
      - name: Build shared packages
        run: |
          pnpm --filter @tunarr/types build
          pnpm --filter @tunarr/shared build
      - name: Regenerate API artifacts after title schema changes
        if: runner.os == 'Linux'
        run: |
          TUNARR_DATABASE_PATH="$(mktemp -d)" pnpm --filter @tunarr/server generate-openapi
          pnpm --filter @tunarr/web generate-client
          node --input-type=module -e 'import fs from "node:fs"; import {execFileSync} from "node:child_process"; const paths=execFileSync("git",["diff","--name-only","--","docs/generated","web/src/generated"],{encoding:"utf8"}).trim().split("\n").filter(Boolean); for (const p of paths) console.log("XBEST_GENERATED "+JSON.stringify({path:p,content:fs.readFileSync(p,"utf8")}));'
      - name: Typecheck server and web
        run: |
          pnpm --filter @tunarr/server typecheck
          pnpm --filter @tunarr/web typecheck
      - name: Test hardware selection, persistence, pipeline and authentication
        env:
          XBEST_CAPTURE_LOGIN: '1'
        run: pnpm --filter @tunarr/server test src/services/desktop/videoTools.test.ts src/services/desktop/DesktopStartup.test.ts src/ffmpeg/AutoHardwareAcceleration.test.ts src/db/TranscodeConfigDB.test.ts src/ffmpeg/FfmpegStreamFactory.test.ts src/stream/etv/EtvNextSession.test.ts src/util/basicAuth.test.ts src/services/access/AccessControl.test.ts src/services/access/StudioWebLogin.test.ts scripts/releaseArchive.test.ts scripts/customerAssets.test.ts scripts/releaseChecksums.test.ts src/services/archive/ArchiveStore.test.ts src/services/archive/ChannelArchiveService.test.ts src/services/overlay/countdownAss.test.ts src/services/overlay/ChannelOverlayService.test.ts src/ffmpeg/FfmpegTrancodeSession.test.ts src/ffmpeg/builder/pipeline/ProgramOverlayPipeline.test.ts
      - name: Typecheck owner access and packaging tests
        run: pnpm --filter @tunarr/server exec tsc --noEmit -p tsconfig.access-test.json
      - name: Install FFmpeg for archive acceptance tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify real archive preparation, cancellation and playback offsets
        if: runner.os == 'Linux'
        env:
          XBEST_FFMPEG_TEST: '1'
        run: pnpm --filter @tunarr/server test src/services/archive/ArchiveStore.test.ts src/services/archive/ChannelArchiveService.test.ts src/services/overlay/countdownAss.test.ts
      - name: Test live monitor, countdown, links and Arabic catalog
        run: pnpm --filter @tunarr/web exec vitest run --project unit src/components/channels/ChannelSessionsDialog.test.tsx src/components/channels/ChannelArchiveDialog.test.tsx src/components/channels/ChannelOverlayDialog.test.tsx src/components/channels/ChannelNowPlayingCard.test.tsx src/components/channels/ChannelMenuButton.test.tsx src/components/channels/channelSummary.test.ts src/locales/catalogs.test.ts src/test/i18n.test.ts src/store/settings/store.test.ts src/components/settings/general/WebSettings.test.tsx src/pages/settings/AccessSettingsPage.test.tsx src/pages/studio/StudioDashboard.test.tsx src/components/shell/XBestShell.test.tsx src/components/channels/ChannelCard.test.tsx src/components/channels/ChannelsView.test.tsx
      - name: Build web bundle
        run: pnpm --filter @tunarr/web bundle
      - name: Install browser for Arabic monitor smoke test
        if: runner.os == 'Linux'
        run: pnpm --filter @tunarr/web exec playwright install --with-deps chromium
      - name: Check Arabic monitor in a real browser
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @tunarr/web exec node src/test/live-monitor-smoke.mjs
          pnpm --filter @tunarr/web exec node src/test/studio-smoke.mjs
      - name: Upload monitor screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: xbest-live-monitor-screenshots
          path: |
            web/test-results/live-monitor/
            web/test-results/studio/
          if-no-files-found: ignore
      - name: Check Linux launcher syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/start-xbest.sh
      - name: Check Windows launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/start-xbest.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

      - name: Check owner launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/XBEST-OWNER.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

  package:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, win-x64]
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
      TUNARR_VERSION: 2026.11.1-preview
      TUNARR_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: ilammy/setup-nasm@v1
      - name: Enable workspace package manager
        run: |
          npm install -g corepack@latest
          corepack enable
      - run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development
      - name: Build application
        run: |
          pnpm --filter @tunarr/types build
          pnpm --filter @tunarr/shared build
          pnpm --filter @tunarr/web bundle
          pnpm --filter @tunarr/server bundle
      - name: Generate XBEST icon from the studio mark
        run: node scripts/make-xbest-ico.mjs
      - name: Package executable and companion tools
        run: pnpm --filter @tunarr/server make-bin --target ${{ matrix.target }} --output-archives
      - name: Upload preview and protected launchers
        uses: actions/upload-artifact@v4
        with:
          name: XBEST-preview-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            server/bin/XBEST-20*.zip
            server/bin/XBEST-20*.tar.gz
            server/bin/XBEST-20*.SHA256SUMS
            scripts/start-xbest.ps1
            scripts/start-xbest.sh
            docs/xbest-cpu-gpu-login.md
            LICENSE

      - name: Upload owner distribution separately
        if: matrix.target == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: XBEST-OWNER-win-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            server/bin/XBEST-OWNER-*.zip
            server/bin/XBEST-OWNER-*.SHA256SUMS

  desktop-acceptance:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XBEST-preview-win-x64
          path: preview
      - name: Test the packaged Windows executable with a busy default port
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem preview -Recurse -Filter 'XBEST-*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'XBEST archive missing' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath app
          $exe = Get-ChildItem app -Recurse -Filter XBEST.exe | Select-Object -First 1
          if (-not $exe) { throw 'XBEST.exe missing' }
          if ($exe.VersionInfo.ProductName -ne 'XBEST') { throw 'XBEST executable metadata missing' }
          $env:TUNARR_DATABASE_PATH = Join-Path $env:RUNNER_TEMP ('XBEST-acceptance-' + [guid]::NewGuid())
          $env:XBEST_NO_BROWSER = '1'
          $env:XBEST_AUTOSTART = '1'
          New-Item -ItemType Directory -Path acceptance -Force | Out-Null
          $stdout = Join-Path $PWD 'acceptance\startup.log'
          $stderr = Join-Path $PWD 'acceptance\startup-errors.log'
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Any, 8000)
          $app = $null
          $second = $null
          try {
            $listener.Start()
            $app = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.Directory.FullName -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $ready = $false
            for ($i = 0; $i -lt 240; $i++) {
              if ($app.HasExited) { throw "XBEST exited with $($app.ExitCode)" }
              $settingsFile = Join-Path $env:TUNARR_DATABASE_PATH 'settings.json'
              if (Test-Path $settingsFile) {
                try {
                  $settings = Get-Content -LiteralPath $settingsFile -Raw | ConvertFrom-Json
                  $port = [int]$settings.system.server.port
                  if ($port -gt 0 -and $port -ne 8000) {
                    $response = Invoke-WebRequest -Uri "http://localhost:$port/web/" -TimeoutSec 2
                    if ($response.StatusCode -eq 200 -and $response.Content.Contains('<title>XBEST</title>')) {
                      $ready = $true
                      break
                    }
                  }
                } catch {}
              }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw 'Packaged XBEST did not become ready on an automatic port' }
            $second = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.Directory.FullName -PassThru -RedirectStandardOutput (Join-Path $PWD 'acceptance\second.log') -RedirectStandardError (Join-Path $PWD 'acceptance\second-errors.log')
            if (-not $second.WaitForExit(15000)) { throw 'Second launch did not reuse the running instance' }
            if ($second.ExitCode -ne 0) { throw 'Second launch failed' }
            $again = Invoke-WebRequest -Uri "http://localhost:$port/web/" -TimeoutSec 5
            if ($again.StatusCode -ne 200) { throw 'First instance stopped after second launch' }
            $scripts = [regex]::Matches($again.Content, 'src="([^"]+\.js)"')
            if ($scripts.Count -eq 0) { throw 'No web bundle served by the executable' }
            $js = Invoke-WebRequest -Uri ("http://localhost:" + $port + $scripts[0].Groups[1].Value) -TimeoutSec 10
            if (-not $js.Content.Contains('xbest-workspace')) { throw 'Packaged executable is not serving the new studio shell' }
            Write-Host "XBEST packaged desktop acceptance passed on port $port"
          } finally {
            if (Test-Path $stdout) { Get-Content -LiteralPath $stdout }
            if (Test-Path $stderr) { Get-Content -LiteralPath $stderr }
            if ($second -and -not $second.HasExited) { taskkill /PID $second.Id /T /F }
            if ($app -and -not $app.HasExited) { taskkill /PID $app.Id /T /F }
            $listener.Stop()
          }
      - name: Upload packaged startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XBEST-Windows-startup-evidence
          path: acceptance
          if-no-files-found: ignore
