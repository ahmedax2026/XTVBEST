name: XBest CPU GPU and login checks

on:
  push:
    branches: [feature/xbest-studio]
  pull_request:
    branches: [feature/xbest-studio, feature/xbest-cpu-gpu-auth, feature/xbest-live-monitor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable workspace package manager
        run: |
          npm install -g corepack@latest
          corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: |
          pnpm --filter @tunarr/types build
          pnpm --filter @tunarr/shared build
      - name: Typecheck server and web
        run: |
          pnpm --filter @tunarr/server typecheck
          pnpm --filter @tunarr/web typecheck
      - name: Test hardware selection, persistence, pipeline and authentication
        run: pnpm --filter @tunarr/server test src/ffmpeg/AutoHardwareAcceleration.test.ts src/db/TranscodeConfigDB.test.ts src/ffmpeg/FfmpegStreamFactory.test.ts src/stream/etv/EtvNextSession.test.ts src/util/basicAuth.test.ts scripts/customerAssets.test.ts src/services/archive/ArchiveStore.test.ts src/services/archive/ChannelArchiveService.test.ts src/services/overlay/countdownAss.test.ts src/services/overlay/ChannelOverlayService.test.ts src/ffmpeg/FfmpegTrancodeSession.test.ts src/ffmpeg/builder/pipeline/ProgramOverlayPipeline.test.ts
      - name: Install FFmpeg for archive acceptance tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify real archive preparation, cancellation and playback offsets
        if: runner.os == 'Linux'
        env:
          XBEST_FFMPEG_TEST: '1'
        run: pnpm --filter @tunarr/server test src/services/archive/ArchiveStore.test.ts src/services/archive/ChannelArchiveService.test.ts src/services/overlay/countdownAss.test.ts
      - name: Test live monitor, countdown, links and Arabic catalog
        run: pnpm --filter @tunarr/web exec vitest run --project unit src/components/channels/ChannelSessionsDialog.test.tsx src/components/channels/ChannelArchiveDialog.test.tsx src/components/channels/ChannelOverlayDialog.test.tsx src/components/channels/ChannelNowPlayingCard.test.tsx src/components/channels/ChannelMenuButton.test.tsx src/components/channels/channelSummary.test.ts src/locales/catalogs.test.ts src/test/i18n.test.ts src/store/settings/store.test.ts src/components/settings/general/WebSettings.test.tsx
      - name: Build web bundle
        run: pnpm --filter @tunarr/web bundle
      - name: Install browser for Arabic monitor smoke test
        if: runner.os == 'Linux'
        run: pnpm --filter @tunarr/web exec playwright install --with-deps chromium
      - name: Check Arabic monitor in a real browser
        if: runner.os == 'Linux'
        run: pnpm --filter @tunarr/web exec node src/test/live-monitor-smoke.mjs
      - name: Upload monitor screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: xbest-live-monitor-screenshots
          path: web/test-results/live-monitor/
          if-no-files-found: ignore
      - name: Check Linux launcher syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/start-xbest.sh
      - name: Check Windows launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/start-xbest.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

  package:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, win-x64]
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
      TUNARR_VERSION: 2026.11.0-xbest-preview
      TUNARR_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: ilammy/setup-nasm@v1
      - name: Enable workspace package manager
        run: |
          npm install -g corepack@latest
          corepack enable
      - run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development
      - name: Build application
        run: |
          pnpm --filter @tunarr/types build
          pnpm --filter @tunarr/shared build
          pnpm --filter @tunarr/web bundle
          pnpm --filter @tunarr/server bundle
      - name: Package executable and companion tools
        run: pnpm --filter @tunarr/server make-bin --target ${{ matrix.target }} --output-archives
      - name: Upload preview and protected launchers
        uses: actions/upload-artifact@v4
        with:
          name: xbest-preview-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            server/bin/tunarr-*.zip
            server/bin/tunarr-*.tar.gz
            scripts/start-xbest.ps1
            scripts/start-xbest.sh
            docs/xbest-cpu-gpu-login.md
            LICENSE
